services:
  db:
    image: postgres:16
    container_name: kpi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-kpi_app}
      TZ: Asia/Jakarta
    volumes:
      - kpi_postgres_data:/var/lib/postgresql/data
    ports:
      # Port 5433 hanya di-bind ke loopback host (127.0.0.1) untuk DBeaver/Admin lokal
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kpi_app}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"


  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-kpi-app:local}
    container_name: kpi-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-kpi_app}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-kpi_app}
      AUTH_MODE: ${AUTH_MODE:-odoo}
      ODOO_BASE_URL: ${ODOO_BASE_URL}
      ODOO_API_VERSION: ${ODOO_API_VERSION:-v1}
      ODOO_ADMIN_USER: ${ODOO_ADMIN_USER}
      ODOO_ADMIN_PASSWORD: ${ODOO_ADMIN_PASSWORD}
      ODOO_SERVICE_NIK: ${ODOO_SERVICE_NIK}
      ODOO_SERVICE_PASSWORD: ${ODOO_SERVICE_PASSWORD}
      DEV_SUPERADMIN_NIK: ${DEV_SUPERADMIN_NIK}
      JWT_SECRET: ${JWT_SECRET:-kpi_system_dev_secret_key_minimum_32_characters_random_fallback}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      NODE_TLS_REJECT_UNAUTHORIZED: ${NODE_TLS_REJECT_UNAUTHORIZED:-1}
      NODE_OPTIONS: "--max-old-space-size=768"
    ports:
      # Port loopback lokal untuk diagnostik (fleksibel via APP_PORT)
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"


  backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    container_name: kpi-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-kpi_app}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_SUFFIX: ".sql.gz"
      POSTGRES_EXTRA_OPTS: "-Z6 --schema=public --blobs"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: kpi-tunnel
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro
    command: tunnel --config /etc/cloudflared/config.yml run
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  kpi_postgres_data:
    name: template_kpi_postgres_data

networks:
  default:
    name: template_default